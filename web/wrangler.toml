# Cloudflare Worker for NewChums Next.js app (OpenNext)
# https://opennext.js.org/cloudflare
# DEV-ONLY: Single deploy target — newchums-web-dev
name = "newchums-web-dev"
main = ".open-next/worker.js"
compatibility_date = "2025-02-18"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
AUTH_URL = "https://newchums-web-dev.robsmith775.workers.dev"
AUTH_TRUST_HOST = "true"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "newchums-web-dev"
