# Cloudflare Worker for NewChums Next.js app (OpenNext)
# https://opennext.js.org/cloudflare
# Single deploy target: newchums-web-dev
name = "newchums-web-dev"
main = ".open-next/worker.js"
compatibility_date = "2025-02-18"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Match remote: custom domains only, no workers.dev subdomain
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Custom domains: must match remote Worker config or deploy would remove them
[[routes]]
pattern = "newchums.com"
zone_name = "newchums.com"
custom_domain = true

[[routes]]
pattern = "www.newchums.com"
zone_name = "newchums.com"
custom_domain = true

# Production canonical host.
#
# Only public, client-side values live in [vars]. Every value here is already
# exposed in the browser bundle at runtime (OAuth client ID, the referrer-
# restricted Google Maps browser key, public API/avatar origins), so none of it
# is a secret. Real secrets (AUTH_SECRET, GOOGLE_CLIENT_SECRET, DATABASE_URL,
# RESEND_API_KEY, etc.) are stored in the Cloudflare Worker secret store via
# `wrangler secret put` and are never committed to this file or the repo.
[vars]
AUTH_URL = "https://newchums.com"
AUTH_TRUST_HOST = "true"
NEXTAUTH_URL = "https://newchums.com"
GOOGLE_CLIENT_ID = "408122271431-fdenoqaiec18udki7i3k9fu4mc2tvbpe.apps.googleusercontent.com"
NEXT_PUBLIC_GOOGLE_MAPS_API_KEY = "AIzaSyCwdarGM-BB5hAb5T3Xr091-f-vAqPW9jE"
NEXT_PUBLIC_API_BASE_URL = "https://newchums-api.robsmith775.workers.dev"
NEXT_PUBLIC_AVATAR_BASE_URL = "https://newchums-api.robsmith775.workers.dev"

# Self-reference for OpenNext (no environment = avoids "Could not apply service and environment tags" warning)
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "newchums-web-dev"