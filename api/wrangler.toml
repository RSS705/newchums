name = "newchums-api"
main = "src/index.ts"
compatibility_date = "2026-02-09"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
APP_ENV = "production"
EMAIL_FROM = "NewChums <no-reply@ourmodule.com>"
WEB_BASE_URL = "https://newchums.com"
POSTMARK_TEMPLATE_VERIFY = "43483393"
POSTMARK_TEMPLATE_RESET  = "43483403"
POSTMARK_TEMPLATE_RSVP   = "43483423"
# Create templates in Postmark; replace with real IDs
POSTMARK_TEMPLATE_EMAIL_CHANGE_CONFIRM = "43739983"
POSTMARK_TEMPLATE_EMAIL_CHANGE_NOTIFY_OLD = "43740027"
POSTMARK_TEMPLATE_EMAIL_CHANGE_SUCCESS = "43740066"
AXIOM_DATASET = "newchums-api"

[env.preview.vars]
APP_ENV = "preview"
EMAIL_FROM = "NewChums <no-reply@ourmodule.com>"
WEB_BASE_URL = "https://newchums.com"
POSTMARK_TEMPLATE_VERIFY = "43483393"
POSTMARK_TEMPLATE_RESET = "43483403"
POSTMARK_TEMPLATE_RSVP = "43483423"
POSTMARK_TEMPLATE_EMAIL_CHANGE_CONFIRM = "43739983"
POSTMARK_TEMPLATE_EMAIL_CHANGE_NOTIFY_OLD = "43740027"
POSTMARK_TEMPLATE_EMAIL_CHANGE_SUCCESS = "43740066"
AXIOM_DATASET = "newchums-api"

[env.production.vars]
APP_ENV = "production"
EMAIL_FROM = "NewChums <no-reply@ourmodule.com>"
WEB_BASE_URL = "https://newchums.com"
POSTMARK_TEMPLATE_VERIFY = "43483393"
POSTMARK_TEMPLATE_RESET = "43483403"
POSTMARK_TEMPLATE_RSVP = "43483423"
POSTMARK_TEMPLATE_EMAIL_CHANGE_CONFIRM = "43739983"
POSTMARK_TEMPLATE_EMAIL_CHANGE_NOTIFY_OLD = "43740027"
POSTMARK_TEMPLATE_EMAIL_CHANGE_SUCCESS = "43740066"
AXIOM_DATASET = "newchums-api"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "newchums-media"

