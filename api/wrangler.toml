name = "newchums-api"
main = "src/index.ts"
compatibility_date = "2026-02-09"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[vars]
APP_ENV = "production"
EMAIL_FROM = "NewChums <no-reply@newchums.com>"
WEB_BASE_URL = "https://newchums.com"
AXIOM_DATASET = "newchums-api"

[triggers]
crons = ["0 * * * *"]

[env.preview.vars]
APP_ENV = "preview"
EMAIL_FROM = "NewChums <no-reply@newchums.com>"
WEB_BASE_URL = "https://newchums.com"
AXIOM_DATASET = "newchums-api"

[env.production.vars]
APP_ENV = "production"
EMAIL_FROM = "NewChums <no-reply@newchums.com>"
WEB_BASE_URL = "https://newchums.com"
AXIOM_DATASET = "newchums-api"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "newchums-media"

# Durable Objects for real-time plan chat
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

# Contact form rate limit (5 per 10 min per IP). Create with: npx wrangler kv namespace create CONTACT_RATELIMIT
# [[kv_namespaces]]
# binding = "CONTACT_RATELIMIT_KV"
# id = "<paste-id-from-create-command>"
